services:
  thunderbird:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: thunderbird
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=Australia/Sydney
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      - TB_API_TOKEN=${TB_API_TOKEN:?Set TB_API_TOKEN (e.g. openssl rand -hex 32) in docker/.env}
      - TB_API_HOST=0.0.0.0
      - TB_API_HOSTS=thunderbird
      - TB_API_ALLOWED_ORIGINS=${TB_API_ALLOWED_ORIGINS:-}
      - VNC_PASSWORD=${VNC_PASSWORD:-}
      - KEEP_APP_RUNNING=1
    ports:
      # Published on the Docker host only; other containers reach the API at
      # http://thunderbird:9595 over the shared Docker network.
      - "127.0.0.1:5800:5800"
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:9595:9595"
    volumes:
      - thunderbird_config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Authorization: Bearer $$TB_API_TOKEN\" http://127.0.0.1:9595/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  thunderbird_config:
