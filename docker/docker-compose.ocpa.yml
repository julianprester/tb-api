# Optional override for deployments that must join the shared ocpa-network.
# The external network must already exist. Use it with:
#
#   docker compose -f docker-compose.yml -f docker-compose.ocpa.yml up -d
#
# deploy.sh adds this file automatically when it is present. The base
# docker-compose.yml works on its own for everyone else.

services:
  thunderbird:
    networks:
      - ocpa-network

networks:
  ocpa-network:
    external: true
